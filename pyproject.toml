[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livetracking"
version = "0.1.0"
description = "Real-time projection mapping with depth-camera tracking and cobblestone calibration."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ted Barnett" }]
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pygame==2.6.1",
    "moderngl==5.10.0",
    "PyQt6==6.7.1",
    "flask>=3.0",
    "pyrealsense2==2.55.1.6486; platform_system == 'Windows'",
]

[project.scripts]
livetracking = "livetracking.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
