[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livetracking"
version = "0.2.0"
description = "Real-time projection mapping: detect objects in the projector footprint and illuminate them on demand."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ted Barnett" }]
dependencies = [
    "numpy>=1.26,<2.3",
    "opencv-python>=4.10",
    "pygame>=2.6",
    "flask>=3.0",
    "pyzmq>=26",
    "pyrealsense2>=2.55; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Heavy ML stack lives behind an extra. Install with:
#   pip install --pre torch --index-url https://download.pytorch.org/whl/nightly/cu128
#   pip install -e .[ml]
ml = [
    "transformers>=4.45",
    "open3d>=0.18",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
