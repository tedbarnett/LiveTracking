<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LiveTracking — Perception</title>
<style>
  body { background: #111; color: #eee; font-family: -apple-system, Segoe UI, Helvetica, sans-serif; margin: 0; }
  header { padding: 12px 18px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { font-size: 12px; color: #888; flex: 1; text-align: right; }
  header .controls { display: flex; gap: 8px; align-items: center; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a3a3a; }
  button.primary { background: #2d5a2d; border-color: #4a8a4a; }
  button.primary:hover { background: #3d6a3d; }
  button.warn    { background: #5a2d2d; border-color: #8a4a4a; }
  button.warn:hover    { background: #6a3d3d; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: 12px; height: calc(100vh - 64px); box-sizing: border-box; }
  #stream-wrap { background: #000; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
  #stream { max-width: 100%; max-height: 100%; }
  #paused-overlay { position: absolute; top: 12px; right: 12px; background: #5a2d2d; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; display: none; }
  #paused-overlay.on { display: block; }
  #side { background: #1a1a1a; border-radius: 6px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .panel { display: flex; flex-direction: column; gap: 6px; }
  .panel h2 { margin: 0 0 4px 0; font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  .row { display: flex; gap: 8px; align-items: center; }
  #help { font-size: 11px; color: #666; }
  .obj { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 4px; margin-bottom: 4px; cursor: pointer; transition: background 0.1s; }
  .obj:hover { background: #2a2a2a; }
  .obj.hovered { background: #333; outline: 1px solid #555; }
  .obj.pinned  { background: #2b2b3a; outline: 2px solid #88a; }
  .swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; border: 1px solid #000; box-shadow: 0 0 0 1px #444; }
  .hide-btn { background: transparent; border: 1px solid #444; color: #888; width: 22px; height: 22px; border-radius: 4px; padding: 0; font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .hide-btn:hover { background: #4a1f1f; border-color: #c44; color: #fff; }
  .num { width: 24px; text-align: right; color: #888; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; }
  .name { flex: 1; min-width: 0; }
  .name input { background: transparent; border: 1px solid transparent; color: #eee; font-size: 14px; padding: 2px 4px; border-radius: 3px; width: 100%; box-sizing: border-box; }
  .name input:hover { border-color: #444; }
  .name input:focus { border-color: #888; outline: none; background: #111; }
  .meta-line { font-size: 10px; color: #666; margin-top: 1px; }
  #status { font-size: 11px; color: #555; padding-top: 8px; border-top: 1px solid #222; }
  .slider-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .slider-row input[type=range] { flex: 1; }
</style>
</head>
<body>
<header>
  <h1>LiveTracking — perception</h1>
  <div class="controls">
    <button id="btnPause" class="primary">⏸ Pause</button>
    <button id="btnAll">Highlight all</button>
    <button id="btnClear">Clear</button>
    <button id="btnWhite">☀ White Light</button>
    <button id="btnRecalibrate" title="Stop perception, project dot grid, re-solve homography, restart.">⟳ Re-calibrate</button>
    <button id="btnUnhide" style="display:none;">Unhide all</button>
  </div>
  <div class="meta"><span id="frameTimings">…</span></div>
</header>
<main>
  <div id="stream-wrap">
    <img id="stream" src="/stream.mjpg" alt="live camera">
    <div id="paused-overlay">PAUSED</div>
  </div>
  <aside id="side">
    <div class="panel">
      <h2>Objects</h2>
      <div id="help">Hover an item to illuminate it on the wall. Click name to rename.</div>
      <div id="objList"></div>
    </div>
    <div class="panel">
      <h2>Projector intensity</h2>
      <div class="slider-row">
        <span>dim</span>
        <input id="intensitySlider" type="range" min="0" max="100" value="78">
        <span>bright</span>
        <span id="intensityVal">78</span>
      </div>
    </div>
    <div id="status">connecting…</div>
  </aside>
</main>
<script>
const objList = document.getElementById('objList');
const statusEl = document.getElementById('status');
const timingsEl = document.getElementById('frameTimings');
const pausedOverlay = document.getElementById('paused-overlay');
const btnPause = document.getElementById('btnPause');
const btnAll = document.getElementById('btnAll');
const btnClear = document.getElementById('btnClear');
const btnWhite = document.getElementById('btnWhite');
const btnRecalibrate = document.getElementById('btnRecalibrate');
const btnUnhide = document.getElementById('btnUnhide');
const intensitySlider = document.getElementById('intensitySlider');
const intensityVal = document.getElementById('intensityVal');

let lastHovered = null;
let editing = new Set();
let isPaused = false;

function rgb(a) { return `rgb(${a[0]}, ${a[1]}, ${a[2]})`; }

function setPaused(p) {
  isPaused = !!p;
  pausedOverlay.classList.toggle('on', isPaused);
  btnPause.textContent = isPaused ? '▶ Run' : '⏸ Pause';
  btnPause.classList.toggle('primary', !isPaused);
  btnPause.classList.toggle('warn', isPaused);
}

btnPause.addEventListener('click', async () => {
  const r = await fetch(isPaused ? '/run' : '/pause', { method: 'POST' });
  const j = await r.json();
  if ('paused' in j) setPaused(j.paused);
});
btnAll.addEventListener('click', () => {
  fetch('/highlight_all', { method: 'POST' });
});
btnClear.addEventListener('click', () => {
  fetch('/clear', { method: 'POST' });
});

let whiteOn = false;
btnWhite.addEventListener('click', async () => {
  whiteOn = !whiteOn;
  await fetch('/white_light', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value: whiteOn })
  });
  btnWhite.classList.toggle('primary', whiteOn);
  btnWhite.textContent = whiteOn ? '☀ White Light (on)' : '☀ White Light';
});

// ---- Re-calibrate --------------------------------------------------------
let calibPollTimer = null;
function setRecalLabel(text, busy) {
  btnRecalibrate.textContent = text;
  btnRecalibrate.disabled = !!busy;
  btnRecalibrate.classList.toggle('warn', !!busy);
}
async function pollCalibStatus() {
  try {
    const r = await fetch('/calibrate_status');
    const j = await r.json();
    const s = j.status;
    if (!s) return;
    if (s.phase === 'done') {
      clearInterval(calibPollTimer);
      calibPollTimer = null;
      const ok = s.ok === true;
      setRecalLabel(ok ? '⟳ Re-calibrate (done ✓)' : '⟳ Re-calibrate (failed)', false);
      if (!ok) alert('Calibration failed: ' + (s.detail || 'unknown'));
      setTimeout(() => setRecalLabel('⟳ Re-calibrate', false), 4000);
    } else {
      setRecalLabel('⟳ ' + s.phase.replaceAll('_', ' ') + '…', true);
    }
  } catch (e) {
    // ignore transient
  }
}
btnRecalibrate.addEventListener('click', async () => {
  if (!confirm('Re-calibrate? The projector + camera will be unavailable for ~30 seconds.')) return;
  setRecalLabel('⟳ starting…', true);
  const r = await fetch('/recalibrate', { method: 'POST' });
  const j = await r.json();
  if (!j.ok) {
    alert('Could not start calibration: ' + (j.reason || 'unknown'));
    setRecalLabel('⟳ Re-calibrate', false);
    return;
  }
  if (calibPollTimer) clearInterval(calibPollTimer);
  calibPollTimer = setInterval(pollCalibStatus, 800);
  pollCalibStatus();
});

intensitySlider.addEventListener('input', () => {
  intensityVal.textContent = intensitySlider.value;
});
intensitySlider.addEventListener('change', () => {
  fetch('/intensity', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value: intensitySlider.value / 100 })
  });
});

function render(payload) {
  const objs = payload.objects || [];
  setPaused(payload.paused === true);
  statusEl.textContent = `${objs.length} object${objs.length === 1 ? '' : 's'}, ${new Date(payload.t * 1000).toLocaleTimeString()}`;
  if (payload.timings_ms) {
    const t = payload.timings_ms;
    timingsEl.textContent = isPaused
      ? 'paused'
      : `${t.total_ms.toFixed(0)} ms/frame · DINO ${t.n_dino_raw}→${t.n_dino_kept} · ${objs.length} obj`;
  }
  const newIds = new Set(objs.map(o => o.id));
  Array.from(objList.children).forEach(c => {
    if (!newIds.has(Number(c.dataset.id))) c.remove();
  });
  objs.sort((a, b) => a.id - b.id);
  objs.forEach(o => {
    let row = objList.querySelector(`[data-id="${o.id}"]`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'obj';
      row.dataset.id = o.id;
      row.innerHTML = `
        <div class="num"></div>
        <div class="swatch" title="click: cycle color · double-click: pin/unpin"></div>
        <div class="name">
          <input type="text" />
          <div class="meta-line"></div>
        </div>
        <button class="hide-btn" title="Hide this object — won't reappear until you click 'Unhide all'">✕</button>`;
      const inp = row.querySelector('input');
      const swatch = row.querySelector('.swatch');
      const hideBtn = row.querySelector('.hide-btn');
      hideBtn.addEventListener('click', e => {
        e.stopPropagation();
        fetch('/hide', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: o.id }) });
      });
      let clickTimer = null;
      swatch.addEventListener('click', e => {
        e.stopPropagation();
        if (clickTimer) return;
        clickTimer = setTimeout(() => {
          clickTimer = null;
          fetch('/cycle_color', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: o.id }) });
        }, 220);
      });
      swatch.addEventListener('dblclick', e => {
        e.stopPropagation();
        if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
        const wasPinned = row.classList.toggle('pinned');
        if (wasPinned) {
          // unpin any prior pinned row
          objList.querySelectorAll('.obj.pinned').forEach(r => {
            if (r !== row) r.classList.remove('pinned');
          });
          fetch('/pin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: o.id }) });
        } else {
          fetch('/unpin', { method: 'POST' });
        }
      });
      inp.addEventListener('focus', () => editing.add(o.id));
      inp.addEventListener('blur', () => {
        editing.delete(o.id);
        const newName = inp.value.trim();
        if (newName) {
          fetch('/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: o.id, name: newName }) });
        }
      });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); });
      row.addEventListener('mouseenter', () => {
        row.classList.add('hovered');
        lastHovered = o.id;
        fetch('/highlight', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: o.id }) });
      });
      row.addEventListener('mouseleave', () => {
        row.classList.remove('hovered');
        if (lastHovered === o.id) lastHovered = null;
        fetch('/clear', { method: 'POST' });
      });
      objList.appendChild(row);
    }
    row.querySelector('.num').textContent = `#${o.id}`;
    row.querySelector('.swatch').style.background = rgb(o.color);
    if (!editing.has(o.id)) {
      row.querySelector('input').value = o.name;
    }
    row.querySelector('.meta-line').textContent =
      `${(o.score * 100).toFixed(0)}% · ${o.depth_m.toFixed(2)} m` +
      (o.has_proj_mask ? '' : ' · ⚠ no proj mask');
  });
}

// Initial state sync
fetch('/state').then(r => r.json()).then(j => { if ('paused' in j) setPaused(j.paused); });

btnUnhide.addEventListener('click', () => {
  fetch('/unhide_all', { method: 'POST' }).then(() => refreshHiddenCount());
});

function refreshHiddenCount() {
  fetch('/hidden_list').then(r => r.json()).then(j => {
    const n = (j && j.ids) ? j.ids.length : 0;
    if (n > 0) {
      btnUnhide.style.display = '';
      btnUnhide.textContent = `Unhide all (${n})`;
    } else {
      btnUnhide.style.display = 'none';
    }
  }).catch(() => {});
}
setInterval(refreshHiddenCount, 3000);
refreshHiddenCount();

const es = new EventSource('/objects');
es.addEventListener('update', e => {
  try { render(JSON.parse(e.data)); } catch (err) { console.error(err); }
});
es.onerror = () => { statusEl.textContent = 'disconnected — retrying'; };
</script>
</body>
</html>
